name: Build ISO

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "profile/**"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      # actions/checkout needs git already present in the job container,
      # and archlinux:latest has nothing preinstalled.
      - name: Install git (needed before checkout can run)
        run: pacman -Sy --noconfirm --needed git

      # packages/sarina is a private repo (chymaera3301/Sarina). The default
      # GITHUB_TOKEN cannot check out a different private repo, so this
      # needs a PAT/deploy key with read access to it, stored as the
      # SARINA_REPO_TOKEN secret. Until that secret is added, the main repo
      # still checks out fine (falls back to the default token below), but
      # the submodule checkout will fail on private-repo access.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SARINA_REPO_TOKEN || github.token }}

      - name: Install remaining build dependencies
        run: |
          pacman -Sy --noconfirm --needed archiso curl base-devel sudo

      - name: Build local packages (sarina-git, calamares; as non-root, makepkg refuses root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          chown -R builder:builder .
          sudo -u builder ./scripts/build-local-packages.sh

      - name: Build ISO (as root; mkarchiso requires it)
        run: ./scripts/build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: chymaera-iso
          path: out/*.iso
          if-no-files-found: error
