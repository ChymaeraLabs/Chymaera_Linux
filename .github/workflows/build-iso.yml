name: Build ISO

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "profile/**"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      # packages/agent is a private repo (chymaera3301/Chymaera_Code_Agent).
      # The default GITHUB_TOKEN cannot check out a different private repo,
      # so this needs a PAT/deploy key with read access to it, stored as the
      # AGENT_REPO_TOKEN secret. Until that secret is added, submodule
      # checkout below will fail on private-repo access.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.AGENT_REPO_TOKEN }}

      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm --needed archiso git curl base-devel sudo

      - name: Build chymaera-code-agent-git (as non-root; makepkg refuses root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          chown -R builder:builder .
          sudo -u builder ./scripts/build-agent-package.sh

      - name: Build ISO (as root; mkarchiso requires it)
        run: ./scripts/build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: chymaera-iso
          path: out/*.iso
          if-no-files-found: error
